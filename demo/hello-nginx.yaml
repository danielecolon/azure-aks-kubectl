apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-html
  namespace: demo
data:
  index.html: |
    <head>
        <!-- Force no-cache across browsers -->
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />
    </head>
    <h1>Hello World from AKS!</h1>
    <h2>Served by Pod: <!--#echo var="hostname" --></h2>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf
  namespace: demo
data:
  default.conf: |
    server {
      listen 80;
      location / {
        root /usr/share/nginx/html;
        index index.html;
        ssi on;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-nginx
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-nginx
  template:
    metadata:
      labels:
        app: hello-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        - name: conf
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: html
        configMap:
          name: hello-html
      - name: conf
        configMap:
          name: nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: hello-nginx
  namespace: demo
spec:
  type: LoadBalancer
  selector:
    app: hello-nginx
  ports:
  - port: 80
    targetPort: 80